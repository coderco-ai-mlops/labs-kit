[project]
name = "labkit"
version = "0.1.0"
description = "The lab command for CoderCo AI & MLOps course labs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lab = "labkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labkit"]
